<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap">
  <style>
    body { margin: 0; font-family: 'Montserrat', system-ui, sans-serif; color: #ffffff; background: #03302f; -webkit-font-smoothing: antialiased; }
    a { color: #7fe3d5; text-decoration: none; }
    a:hover { color: #ffffff; }
    .eyebrow { font-size: 9.5px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
    .tab { flex: 1 1 0; display: grid; place-items: center; gap: 5px; height: 68px; color: rgba(255,255,255,.45); }
    .tab-on { color: #e0a449; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #06403c">

  <!-- map -->
  <svg style="position: absolute; inset: 0" width="390" height="844" viewBox="0 0 390 844" aria-hidden="true">
    <defs>
      <linearGradient id="seaMM" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0b7a72"></stop><stop offset="60%" stop-color="#085e5a"></stop><stop offset="100%" stop-color="#043634"></stop></linearGradient>
      <linearGradient id="landMM" x1="0" y1="1" x2="1" y2="0"><stop offset="0%" stop-color="#094c48"></stop><stop offset="100%" stop-color="#106b63"></stop></linearGradient>
      <pattern id="stippleMM" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.4" fill="#0d7f78" fill-opacity=".5"></circle><circle cx="11" cy="10" r="1.1" fill="#14a093" fill-opacity=".3"></circle></pattern>
      <radialGradient id="focusMM" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#e0a449" stop-opacity=".4"></stop><stop offset="100%" stop-color="#e0a449" stop-opacity="0"></stop></radialGradient>
    </defs>
    <rect width="390" height="844" fill="url(#seaMM)"></rect>
    <g stroke="#2ec2b0" stroke-opacity=".09" stroke-width="1"><path d="M0 170H390M0 340H390M0 510H390M0 680H390"></path><path d="M130 0V844M260 0V844"></path></g>
    <path d="M40 844C86 670 170 520 300 400C336 366 366 344 390 328V0H390V844Z" fill="url(#landMM)"></path>
    <path d="M40 844C86 670 170 520 300 400C336 366 366 344 390 328" fill="none" stroke="#a9e4dc" stroke-opacity=".45" stroke-width="6"></path>
    <path d="M84 844C130 686 208 546 326 436C356 408 376 392 390 382V0H390V844Z" fill="url(#stippleMM)"></path>
    <g fill="none" stroke="#8ee0d4" stroke-opacity=".14" stroke-width="1.4">
      <path d="M150 844C194 712 264 610 366 528C378 518 386 512 390 510"></path>
    </g>
    <path d="M390 420C348 448 318 490 296 540C270 598 254 660 244 736" fill="none" stroke="#063f3c" stroke-opacity=".55" stroke-width="8" stroke-linecap="round"></path>
    <path d="M390 420C348 448 318 490 296 540C270 598 254 660 244 736" fill="none" stroke="#4fd8c4" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"></path>
    <text transform="translate(46 380) rotate(-66)" font-family="'Montserrat', sans-serif" font-size="10" font-weight="700" letter-spacing="5" fill="rgba(169,228,220,.3)">MITTELMEER</text>

    <circle cx="248" cy="466" r="56" fill="url(#focusMM)"></circle>
    <g stroke="#e9fbf8" stroke-width="2.4">
      <circle cx="330" cy="386" r="8" fill="#a89321"></circle>
      <circle cx="206" cy="560" r="7" fill="#b8742e"></circle>
      <circle cx="316" cy="512" r="7" fill="#9a4ba0"></circle>
      <circle cx="248" cy="466" r="18" fill="#2f8f7f"></circle>
    </g>
    <circle cx="248" cy="466" r="26" fill="none" stroke="#e0a449" stroke-width="4"></circle>
    <text x="248" y="472" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="12" font-weight="900" fill="#ffffff">955</text>
    <text x="248" y="516" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="14" font-weight="800" fill="#ffffff">Jerusalem</text>
  </svg>

  <!-- top bar (below the OS status area) -->
  <div style="position: absolute; left: 0; right: 0; top: 44px; display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 16px; background: rgba(3,48,47,.92)">
    <svg viewBox="0 0 40 40" width="28" height="28" aria-hidden="true">
      <path d="M20 3 34 11v18L20 37 6 29V11Z" fill="none" stroke="#e0a449" stroke-width="2.6" stroke-linejoin="round"></path>
      <path d="M20 27s6-6.6 6-10.4A6 6 0 0 0 14 16.6C14 20.4 20 27 20 27Z" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round"></path>
    </svg>
    <span style="font-size: 17px; font-weight: 900; letter-spacing: -.02em; color: #ffffff">BIBELMAP</span>
    <div style="flex-grow: 1"></div>
    <div style="display: grid; place-items: center; width: 44px; height: 44px; background: rgba(255,255,255,.1)">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5 20 20"></path></svg>
    </div>
    <div style="display: grid; place-items: center; width: 44px; height: 44px; background: rgba(255,255,255,.1)">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
    </div>
  </div>

  <!-- era filter badge -->
  <div style="position: absolute; left: 16px; top: 120px; display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 6px 0 14px; background: #2f8f7f">
    <span style="font-size: 12.5px; font-weight: 800; color: #ffffff">Geteiltes Kgr.</span>
    <span style="font-size: 11px; font-weight: 600; color: rgba(255,255,255,.8)">345</span>
    <span style="display: grid; place-items: center; width: 30px; height: 30px; background: rgba(0,0,0,.2)">
      <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </span>
  </div>

  <!-- zoom -->
  <div style="position: absolute; right: 16px; top: 120px; display: flex; flex-direction: column">
    <div style="display: grid; place-items: center; width: 48px; height: 48px; background: rgba(3,48,47,.88); color: #ffffff"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></div>
    <span style="height: 1px; background: rgba(255,255,255,.18)"></span>
    <div style="display: grid; place-items: center; width: 48px; height: 48px; background: rgba(3,48,47,.88); color: #ffffff"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"></path></svg></div>
  </div>

  <!-- bottom sheet -->
  <div style="position: absolute; left: 0; right: 0; bottom: 68px; height: 366px; display: flex; flex-direction: column; background: #03302f; border-top: 4px solid #e0a449">
    <div style="display: grid; place-items: center; padding: 10px 0 6px">
      <span style="display: block; width: 44px; height: 4px; background: rgba(255,255,255,.3)"></span>
    </div>

    <div style="display: flex; gap: 3px; margin: 4px 16px 14px">
      <span style="flex: 1 1 0; text-align: center; padding: 11px 0; background: #0d7f78; font-size: 12px; font-weight: 800; letter-spacing: .06em; color: #ffffff">ORTE</span>
      <span style="flex: 1 1 0; text-align: center; padding: 11px 0; background: rgba(255,255,255,.07); font-size: 12px; font-weight: 700; letter-spacing: .06em; color: rgba(255,255,255,.55)">ZEITLEISTE</span>
    </div>

    <div style="display: flex; align-items: baseline; gap: 8px; padding: 0 20px 12px">
      <span class="eyebrow" style="color: #7fe3d5">Häufigste Orte</span>
      <div style="flex-grow: 1"></div>
      <span style="font-size: 11px; font-weight: 600; color: rgba(255,255,255,.4)">1.335 kartiert</span>
    </div>

    <div style="flex-grow: 1; overflow: hidden">
      <div style="display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 10px 20px; background: #06403c; border-left: 4px solid #2f8f7f">
        <span style="width: 56px; font-size: 24px; font-weight: 900; letter-spacing: -.03em; color: #e0a449">955</span>
        <div style="flex-grow: 1">
          <div style="font-size: 15px; font-weight: 800; color: #ffffff">Jerusalem</div>
          <div style="font-size: 11px; font-weight: 500; color: rgba(255,255,255,.5)">Siedlung · 37 Bücher</div>
        </div>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#e0a449" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 10px 20px; border-bottom: 1px solid rgba(255,255,255,.08)">
        <span style="width: 56px; font-size: 21px; font-weight: 900; letter-spacing: -.03em; color: #b8742e">658</span>
        <div style="flex-grow: 1">
          <div style="font-size: 15px; font-weight: 700; color: #ffffff">Egypt</div>
          <div style="font-size: 11px; font-weight: 500; color: rgba(255,255,255,.45)">Region</div>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 10px 20px; border-bottom: 1px solid rgba(255,255,255,.08)">
        <span style="width: 56px; font-size: 21px; font-weight: 900; letter-spacing: -.03em; color: #3a6ea8">296</span>
        <div style="flex-grow: 1">
          <div style="font-size: 15px; font-weight: 700; color: #ffffff">Babylon</div>
          <div style="font-size: 11px; font-weight: 500; color: rgba(255,255,255,.45)">Siedlung</div>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 10px 20px">
        <span style="width: 56px; font-size: 21px; font-weight: 900; letter-spacing: -.03em; color: #a89321">202</span>
        <div style="flex-grow: 1">
          <div style="font-size: 15px; font-weight: 700; color: #ffffff">Jordan</div>
          <div style="font-size: 11px; font-weight: 500; color: rgba(255,255,255,.45)">Fluss</div>
        </div>
      </div>
    </div>
  </div>

  <!-- tab bar -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; background: #021f1e">
    <div class="tab tab-on">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="10" r="2.6"></circle><path d="M12 20s6-6.6 6-10a6 6 0 1 0-12 0c0 3.4 6 10 6 10Z"></path></svg>
      <span style="font-size: 9.5px; font-weight: 800; letter-spacing: .06em">KARTE</span>
    </div>
    <div class="tab">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 16c2-4 5-4 7 0s5 4 8-1"></path><path d="M4 20c2-4 5-4 7 0s5 4 8-1"></path><circle cx="13" cy="7" r="3"></circle></svg>
      <span style="font-size: 9.5px; font-weight: 700; letter-spacing: .06em">HEATMAP</span>
    </div>
    <div class="tab">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1"></rect><path d="M8 20h8M10.5 9.2v3.6l3.2-1.8Z"></path></svg>
      <span style="font-size: 9.5px; font-weight: 700; letter-spacing: .06em">LESEN</span>
    </div>
    <div class="tab">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.5" r="2.4"></circle><circle cx="5" cy="19.5" r="2.4"></circle><circle cx="19" cy="19.5" r="2.4"></circle><path d="M12 7v4M5 17v-2.5a1.5 1.5 0 0 1 1.5-1.5h11a1.5 1.5 0 0 1 1.5 1.5V17"></path></svg>
      <span style="font-size: 9.5px; font-weight: 700; letter-spacing: .06em">BAUM</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
