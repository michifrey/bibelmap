<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Instrument Sans', 'Inter', system-ui, sans-serif; color: #20302e; background: #f2ead9; -webkit-font-smoothing: antialiased; }
    .disp { font-family: 'Fraunces', Georgia, 'Times New Roman', serif; font-optical-sizing: auto; }
    a { color: #2f6f66; text-decoration: none; }
    a:hover { color: #1f3d3a; }
    .lbl { font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #7c8785; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #f2ead9">

  <!-- map -->
  <svg style="position: absolute; inset: 0" width="390" height="844" viewBox="0 0 390 844" aria-hidden="true">
    <defs>
      <pattern id="grainM" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1.4" cy="1.4" r=".7" fill="rgba(184,116,46,.10)"></circle></pattern>
      <radialGradient id="glowM" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#e0a449" stop-opacity=".38"></stop><stop offset="100%" stop-color="#e0a449" stop-opacity="0"></stop></radialGradient>
    </defs>
    <rect width="390" height="844" fill="#f2ead9"></rect>
    <rect width="390" height="844" fill="url(#grainM)"></rect>
    <g stroke="rgba(31,61,58,.055)" stroke-width="1"><path d="M0 120H390M0 260H390M0 400H390M0 540H390"></path><path d="M110 0V844M240 0V844M370 0V844"></path></g>
    <path d="M0 0H120C104 90 74 200 46 300C22 386 8 470 0 560Z" fill="#dbe7e3"></path>
    <path d="M120 0C104 90 74 200 46 300C22 386 8 470 0 560" fill="none" stroke="#b9a982" stroke-width="1.6"></path>
    <g fill="none" stroke="rgba(184,116,46,.20)" stroke-width="1">
      <path d="M150 120C224 116 260 176 256 258C252 340 220 410 202 480"></path>
      <path d="M172 156C232 152 246 200 242 268C238 336 212 398 196 462"></path>
    </g>
    <ellipse cx="228" cy="176" rx="15" ry="24" fill="#cfe0dc" stroke="#8fb3ab" stroke-width="1.3"></ellipse>
    <path d="M228 200C222 236 236 262 224 296C214 322 214 342 208 362" fill="none" stroke="#8fb3ab" stroke-width="2.4" stroke-linecap="round"></path>
    <ellipse cx="208" cy="412" rx="14" ry="52" fill="#cfe0dc" stroke="#8fb3ab" stroke-width="1.3"></ellipse>
    <circle cx="196" cy="352" r="40" fill="url(#glowM)"></circle>
    <g stroke="#fbf8f1" stroke-width="2.2">
      <circle cx="252" cy="128" r="8" fill="#9a4ba0"></circle>
      <circle cx="180" cy="248" r="9" fill="#2f8f7f"></circle>
      <circle cx="240" cy="330" r="8" fill="#a89321"></circle>
      <circle cx="170" cy="404" r="8" fill="#b8742e"></circle>
      <circle cx="196" cy="352" r="15" fill="#2f8f7f"></circle>
    </g>
    <circle cx="196" cy="352" r="20" fill="none" stroke="#e0a449" stroke-width="2.6"></circle>
    <g font-family="'Instrument Sans', sans-serif" font-weight="600">
      <text x="196" y="390" text-anchor="middle" font-size="12" fill="#20302e">Jerusalem</text>
      <text x="196" y="248" text-anchor="middle" font-size="11" fill="#4a5754">Samaria</text>
    </g>
  </svg>

  <!-- top bar (starts below the OS status area) -->
  <div style="position: absolute; left: 12px; right: 12px; top: 54px; height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 12px; border-radius: 15px; background: rgba(251,248,241,.93); border: 1px solid rgba(31,61,58,.10); box-shadow: 0 1px 2px rgba(20,32,31,.06), 0 10px 26px -12px rgba(20,32,31,.35); backdrop-filter: blur(14px)">
    <div style="display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; background: #1f3d3a">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#e0a449" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s6.5-7.2 6.5-12A6.5 6.5 0 0 0 5.5 9c0 4.8 6.5 12 6.5 12Z"></path><circle cx="12" cy="9" r="2.4"></circle></svg>
    </div>
    <div class="disp" style="font-size: 19px; font-weight: 600; color: #1f3d3a">Bibelmap</div>
    <div style="flex-grow: 1"></div>
    <div style="display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: #efe6d6">
      <span style="padding: 5px 9px; border-radius: 8px; background: #e0a449; color: #1f3d3a; font-size: 11px; font-weight: 700">DE</span>
      <span style="padding: 5px 9px; border-radius: 8px; color: #4a5754; font-size: 11px; font-weight: 600">EN</span>
    </div>
    <div style="display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; color: #1f3d3a">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
    </div>
  </div>

  <!-- floating actions: 48px targets -->
  <div style="position: absolute; right: 12px; top: 122px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: grid; place-items: center; width: 48px; height: 48px; border-radius: 15px; background: #1f3d3a; color: #f7f1e6; box-shadow: 0 1px 2px rgba(20,32,31,.1), 0 10px 22px -10px rgba(31,61,58,.8)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M10.5 9.2v3.6l3.2-1.8Z"></path></svg>
    </div>
    <div style="display: grid; place-items: center; width: 48px; height: 48px; border-radius: 15px; background: rgba(251,248,241,.93); color: #1f3d3a; border: 1px solid rgba(31,61,58,.10); box-shadow: 0 1px 2px rgba(20,32,31,.06), 0 10px 22px -12px rgba(20,32,31,.35); backdrop-filter: blur(12px)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.5" r="2.4"></circle><circle cx="5" cy="19.5" r="2.4"></circle><circle cx="19" cy="19.5" r="2.4"></circle><path d="M12 7v4M5 17v-2.5a1.5 1.5 0 0 1 1.5-1.5h11A1.5 1.5 0 0 1 19 14.5V17"></path></svg>
    </div>
    <div style="display: grid; place-items: center; width: 48px; height: 48px; border-radius: 15px; background: rgba(251,248,241,.93); color: #1f3d3a; border: 1px solid rgba(31,61,58,.10); box-shadow: 0 1px 2px rgba(20,32,31,.06), 0 10px 22px -12px rgba(20,32,31,.35); backdrop-filter: blur(12px)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 16c2-4 5-4 7 0s5 4 8-1"></path><path d="M4 20c2-4 5-4 7 0s5 4 8-1"></path><circle cx="13" cy="7" r="3"></circle></svg>
    </div>
  </div>

  <!-- bottom sheet -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 412px; display: flex; flex-direction: column; border-radius: 22px 22px 0 0; background: #fbf8f1; border-top: 1px solid rgba(31,61,58,.10); box-shadow: 0 -2px 4px rgba(20,32,31,.04), 0 -18px 44px -18px rgba(20,32,31,.45)">

    <div style="display: grid; place-items: center; padding: 9px 0 4px">
      <span style="display: block; width: 40px; height: 4px; border-radius: 9px; background: rgba(31,61,58,.20)"></span>
    </div>

    <div style="padding: 6px 16px 12px">
      <div style="display: flex; align-items: center; gap: 9px; height: 46px; padding: 0 13px; border-radius: 13px; background: #f2ead9; border: 1px solid rgba(31,61,58,.12)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#7c8785" stroke-width="1.9" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5 20 20"></path></svg>
        <span style="font-size: 14px; color: #7c8785">Ort oder Begriff suchen …</span>
      </div>
    </div>

    <div style="display: flex; gap: 3px; margin: 0 16px 12px; padding: 3px; border-radius: 12px; background: #efe6d6">
      <span style="flex: 1 1 0; text-align: center; padding: 9px 0; border-radius: 10px; background: #fbf8f1; font-size: 13px; font-weight: 600; color: #1f3d3a; box-shadow: 0 1px 2px rgba(20,32,31,.08)">Orte</span>
      <span style="flex: 1 1 0; text-align: center; padding: 9px 0; border-radius: 10px; font-size: 13px; font-weight: 500; color: #4a5754">Zeitleiste</span>
    </div>

    <div style="display: flex; align-items: baseline; gap: 8px; padding: 0 20px 8px">
      <span class="lbl">Häufigste Orte</span>
      <div style="flex-grow: 1"></div>
      <span style="font-size: 11px; color: #7c8785">1.335 kartiert</span>
    </div>

    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; padding: 0 10px; overflow: hidden">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 6px 10px; border-radius: 13px; background: #efe6d6">
        <svg viewBox="0 0 24 24" width="40" height="40" style="flex-shrink: 0"><rect width="24" height="24" rx="7" fill="#2f8f7f" fill-opacity=".14"></rect><g fill="none" stroke="#2f8f7f" stroke-width="1.5" stroke-linecap="round"><path d="M5 18v-6h14v6"></path><path d="M5 15h14"></path><path d="M9 18v-3M15 18v-3"></path><path d="M8 12V9l4-3 4 3v3"></path></g></svg>
        <div style="flex-grow: 1">
          <div style="font-size: 15px; font-weight: 600; color: #1f3d3a">Jerusalem</div>
          <div style="font-size: 12px; color: #7c8785">955 Erwähnungen · Siedlung</div>
        </div>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#2f6f66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 6px 10px; border-radius: 13px">
        <svg viewBox="0 0 24 24" width="40" height="40" style="flex-shrink: 0"><rect width="24" height="24" rx="7" fill="#b8742e" fill-opacity=".13"></rect><g fill="none" stroke="#b8742e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17.5c2-.9 3.4.9 5.5 0s3.5.9 5.5 0 3-.9 5 0"></path><path d="M6.5 14 11 6.5 15.5 14"></path><path d="M14 14l3.5-5.5L20 13"></path></g></svg>
        <div style="flex-grow: 1">
          <div style="font-size: 15px; font-weight: 600; color: #20302e">Egypt</div>
          <div style="font-size: 12px; color: #7c8785">658 Erwähnungen · Region</div>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 6px 10px; border-radius: 13px">
        <svg viewBox="0 0 24 24" width="40" height="40" style="flex-shrink: 0"><rect width="24" height="24" rx="7" fill="#2f8f7f" fill-opacity=".13"></rect><g fill="none" stroke="#2f8f7f" stroke-width="1.5" stroke-linecap="round"><path d="M4 19h16"></path><path d="M6 19v-3h12v3"></path><path d="M8 16v-3h8v3"></path><path d="M10 13V9h4v4"></path><path d="M12 9V5.5"></path></g></svg>
        <div style="flex-grow: 1">
          <div style="font-size: 15px; font-weight: 600; color: #20302e">Babylon</div>
          <div style="font-size: 12px; color: #7c8785">296 Erwähnungen · Siedlung</div>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 6px 10px; border-radius: 13px">
        <svg viewBox="0 0 24 24" width="40" height="40" style="flex-shrink: 0"><rect width="24" height="24" rx="7" fill="#3a6ea8" fill-opacity=".13"></rect><g fill="none" stroke="#3a6ea8" stroke-width="1.5" stroke-linecap="round"><path d="M4 8c2.5-1.4 4 1.4 6.5 0S15 8 17.5 6.6 20 8 20 8"></path><path d="M4 13c2.5-1.4 4 1.4 6.5 0S15 13 17.5 11.6 20 13 20 13"></path><path d="M4 18c2.5-1.4 4 1.4 6.5 0S15 18 17.5 16.6 20 18 20 18"></path></g></svg>
        <div style="flex-grow: 1">
          <div style="font-size: 15px; font-weight: 600; color: #20302e">Jordan</div>
          <div style="font-size: 12px; color: #7c8785">202 Erwähnungen · Fluss</div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
