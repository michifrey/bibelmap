name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Vor dem Bauen: die Prüfungen, die ohne Netz auskommen. Ein Tippfehler
      # in den Buchkürzeln oder eine Stammesgrenze, die einen biblisch
      # benannten Ort verfehlt, hält die Veröffentlichung auf, statt still
      # mitzufahren. Was von fremden Servern abhängt (check:bp, check:links),
      # läuft bewusst nicht hier: ein Anbieter mit Schluckauf darf keinen
      # Deploy blockieren.
      - name: Prüfungen
        run: npm run check
      # Eigene Domain (public/CNAME): die Seite liegt an der Wurzel, nicht mehr
      # unter /bibelmap/. VITE_BASE bleibt als Notausgang in vite.config.ts.
      - name: Build
        run: npm run build
      # Fotoscan liegt als eigenständige App unter apps/fotoscan und fährt als
      # Unterpfad /fotoscan/ mit. Bewusst mit continue-on-error: Fotoscan ist
      # hier zu Gast und darf die Karte nicht aus dem Netz nehmen. Schlägt der
      # Bau fehl, ist das im Lauf sichtbar, die Karte geht trotzdem online.
      - name: Fotoscan bauen
        continue-on-error: true
        working-directory: apps/fotoscan
        run: npm ci && npm run build
        env:
          VITE_BASE: /fotoscan/
          # Der Bau braucht keinen Browser; Playwright soll beim Installieren
          # keine 150 MB nachladen.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Fotoscan übernehmen
        continue-on-error: true
        run: cp -r apps/fotoscan/dist dist/fotoscan
      - uses: actions/configure-pages@v5
        with:
          # Enable GitHub Pages (build type "GitHub Actions") on first run,
          # so no manual repo-settings step is required.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
